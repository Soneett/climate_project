services:
  db:
    image: postgres:15
    container_name: climate-db
    environment:
      POSTGRES_DB: ${DB_NAME:-climate_db}
      POSTGRES_USER: ${DB_USER:-climate_user}
      POSTGRES_PASSWORD: ${DB_PASS:-climate_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-climate_user} -d ${DB_NAME:-climate_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./old/backend
      dockerfile: Dockerfile
    container_name: climate-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-climate_user}
      DB_PASS: ${DB_PASS:-climate_pass}
      DB_NAME: ${DB_NAME:-climate_db}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: climate-frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: climate-nginx
    depends_on:
      - backend
      - frontend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
