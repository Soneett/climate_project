<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Test Charts</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fb; color: #1f2937; }
    header { padding: 16px 20px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 2; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .top input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; }
    nav { background: #fff; border-radius: 12px; padding: 12px; height: fit-content; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    nav button { display: block; width: 100%; margin-bottom: 8px; padding: 10px; border: none; border-radius: 8px; text-align: left; cursor: pointer; background: #e2e8f0; }
    nav button.active { background: #1d4ed8; color: #fff; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .chart { height: 460px; }
    .small { font-size: 12px; color: #64748b; }
    .filters { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
    .filters label { background:#f1f5f9; border-radius:8px; padding:6px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Интерактивные графики</h1>
    <div class="top">
      <label>API URL <input id="apiUrl" value="http://127.0.0.1:8081"/></label>
      <label>Region ID <input id="regionId" type="number" value="1"/></label>
      <label>Год для пирамиды <input id="populationYear" type="number" placeholder=""/></label>
      <label>Год от <input id="yearFrom" type="number" value="2020" min="2020" max="2025"/></label>
      <label>Год до <input id="yearTo" type="number" value="2025" min="2020" max="2025"/></label>
      <button id="reloadBtn">Обновить страницу</button>
    </div>
  </header>

  <div class="layout">
    <nav id="menu"></nav>
    <main id="content"></main>
  </div>

  <script>
    const DASHBOARD = [
      {
        id: 's1',
        title: 'Демография',
        charts: [
          {
            title: 'Рождаемость и смертность',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Рождаемость' },
              { indicator: 'Смертность' },
              { indicator: 'Смертность', subtype: 'до 1 года' },
              { indicator: 'Естественный прирост' },
            ],
          },
          {
            title: 'Причины смертности',
            chartType: 'pie',
            seriesSpecs: [
              { indicator: 'Причины смертности', subtype: '*' },
            ],
          },
          {
            title: 'Миграция населения',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Миграционный прирост', subtype: 'Миграция – всего' },
              { indicator: 'Миграционный прирост', subtype: 'в пределах России' },
              { indicator: 'Миграционный прирост', subtype: 'Международная' },
            ],
          },
          {
            title: 'Оценка численности КМН',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Оценка численности населения КМН (на 1 января), человек' },
            ],
          },
        ],
      },
      {
        id: 's2',
        title: 'Уровень жизни',
        charts: [
          {
            title: 'Доходы и расходы (всего)',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Денежные доходы', subtype: 'всего' },
              { indicator: 'Денежные расходы', subtype: 'всего' },
              { indicator: 'Прирост (уменьшение) сбережений', subtype: 'всего' },
            ],
          },
          {
            title: 'Расходы на потребление',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Расходы на потребление', subtype: 'Все домашние хозяйства' },
            ],
          },
          {
            title: 'Уровень бедности',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Численность населения с денежными доходами ниже границы бедности' },
              { indicator: 'Доля населения с денежными доходами ниже границы бедности' },
            ],
          },
        ],
      },
      {
        id: 's3',
        title: 'Здравоохранение',
        charts: [
          {
            title: 'Кадры здравоохранения',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Численность врачей всех специальностей', subtype: 'всего' },
              { indicator: 'Численность среднего медицинского персонала', subtype: 'всего' },

              { indicator: 'Численность врачей всех специальностей', subtype: 'на 10 000 человек населения1)' },
              { indicator: 'Численность среднего медицинского персонала', subtype: 'на 10 000 человек населения1)' },
            ],
          },
          {
            title: 'Мощность и число медорганизаций',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Число амбулаторно-поликлинических организаций' },
              { indicator: 'Число больничных организаций' },
              { indicator: 'Мощность (число посещений в смену) амбулаторно-поликлинических организаций', subtype: 'всего' },
            ],
          },
          {
            title: 'Заболеваемость: все болезни',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Все болезни', subtype: 'Всего заболеваний' },
              { indicator: 'Все болезни', subtype: 'На 1 000 человек населения' },
              { indicator: 'болезни глаза и его придаточного аппарата', subtype: 'Всего заболеваний'}
            ],
          },
        ],
      },
      {
        id: 's5',
        title: 'Экономика',
        charts: [
          {
            title: 'ВРП',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Валовой региональный продукт (в текущих основных ценах), млн рублей' },
              { indicator: 'Валовой региональный продукт (в сопоставимых ценах), в % к предыдущему году' },
            ],
          },
          {
            title: 'Индекс выпуска товаров и услуг',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Индекс выпуска товаров и услуг по базовым видам экономической деятельности по Республике Алтай (к соответствующему периоду предыдущего года, %)' },
            ],
          },
        ],
      },
      {
        id: 's6',
        title: 'Инфраструктура',
        charts: [
          {
            title: 'Автомобильные дороги',
            chartType: 'line',
            seriesSpecs: [
              { indicator: 'Автомобильные дороги', subtype: 'общая протяженность' },
              { indicator: 'Автомобильные дороги', subtype: 'общая протяженность с усовершенствованным покрытием' },
            ],
          },
        ],
      },
    ];

    const menuEl = document.getElementById('menu');
    const contentEl = document.getElementById('content');
    const MIN_YEAR = 2020;
    const MAX_YEAR = 2025;
    let charts = [];
    let activePageId = DASHBOARD[0].id;

    function apiBase() {
      return document.getElementById('apiUrl').value.replace(/\/$/, '');
    }

    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`Ошибка API: ${url}`);
      return r.json();
    }

    async function fetchIndicators() {
      return fetchJson(`${apiBase()}/indicators/get_chunk?limit=5000&offset=0`);
    }

    async function fetchSubtypes() {
      return fetchJson(`${apiBase()}/indicator_subtypes/get_chunk?limit=5000&offset=0`);
    }

    async function fetchChartData(regionId, indicatorIds) {
      const url = new URL(`${apiBase()}/analytics/chart_data`);
      url.searchParams.set('region_id', String(regionId));
      indicatorIds.forEach((id) => url.searchParams.append('indicator_ids', String(id)));
      return fetchJson(url.toString());
    }

    async function fetchPopulation(regionId, yearValue) {
      const url = new URL(`${apiBase()}/analytics/population_pyramid`);
      url.searchParams.set('region_id', String(regionId));
      if (yearValue) url.searchParams.set('year', String(yearValue));
      return fetchJson(url.toString());
    }

    function clearCharts() {
      charts.forEach(c => c.dispose());
      charts = [];
    }

    function getYearRange() {
      const from = Number(document.getElementById('yearFrom').value);
      const to = Number(document.getElementById('yearTo').value);
      const safeFrom = Number.isFinite(from) ? Math.min(Math.max(from, MIN_YEAR), MAX_YEAR) : MIN_YEAR;
      const safeTo = Number.isFinite(to) ? Math.min(Math.max(to, MIN_YEAR), MAX_YEAR) : MAX_YEAR;
      const normalizedFrom = Math.min(safeFrom, safeTo);
      const normalizedTo = Math.max(safeFrom, safeTo);
      return {
        from: normalizedFrom,
        to: normalizedTo,
      };
    }

    function filterPointsByYear(points, yearRange) {
      return points.filter((p) => {
        const year = Number(p.year);
        if (yearRange.from !== null && year < yearRange.from) return false;
        if (yearRange.to !== null && year > yearRange.to) return false;
        return true;
      });
    }

    function buildLineOption(payload, title, enabledSeries = [], yearRange = { from: null, to: null }) {
      const filteredSeries = payload.series
        .filter((series) => !enabledSeries.length || enabledSeries.includes(series.indicator_name))
        .map((series) => ({ ...series, points: filterPointsByYear(series.points, yearRange) }))
        .filter((series) => series.points.length);

      const years = [...new Set(filteredSeries.flatMap(s => s.points.map(p => Number(p.year))))].sort((a,b) => a-b);
      const series = filteredSeries.map((s) => {
        const map = new Map(s.points.map((p) => [Number(p.year), Number(p.value)]));
        return { name: s.indicator_name, type: 'line', smooth: true, data: years.map(y => map.get(y) ?? null) };
      });

      return {
        title: { text: `${title}: ${payload.region_name}`, left: 'center' },
        tooltip: { trigger: 'axis' },
        legend: { data: series.map(s => s.name), top: 35 },
        grid: { left: '4%', right: '4%', bottom: 30, top: 90, containLabel: true },
        xAxis: { type: 'category', data: years.map(String) },
        yAxis: { type: 'value' },
        dataZoom: [
          { type: 'inside', start: 0, end: 100 },
          { type: 'slider', bottom: 4, start: 0, end: 100 }
        ],
        series
      };
    }

    function buildPieOption(payload, title, enabledSeries = [], yearRange = { from: null, to: null }) {
      const filteredSeries = payload.series
        .filter((series) => !enabledSeries.length || enabledSeries.includes(series.indicator_name))
        .map((series) => ({ ...series, points: filterPointsByYear(series.points, yearRange) }))
        .filter((series) => series.points.length);

      const points = filteredSeries.map((series) => {
        const last = [...series.points].sort((a, b) => Number(a.year) - Number(b.year)).at(-1);
        return { name: series.indicator_name, value: last ? Number(last.value) : 0 };
      });

      return {
        title: { text: `${title} (последние значения): ${payload.region_name}`, left: 'center' },
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        series: [{ type: 'pie', radius: '55%', center: ['58%', '58%'], data: points }]
      };
    }

    function buildPopulationOption(payload) {
      const categories = payload.points.map(p => p.age_code);
      const male = payload.points.map(p => -Number(p.male));
      const female = payload.points.map(p => Number(p.female));
      return {
        title: { text: `Половозрастная пирамида: ${payload.region_name} (${payload.year})`, left: 'center' },
        tooltip: {
          trigger: 'axis', axisPointer: { type: 'shadow' },
          formatter: (params) => params.map((p) => `${p.seriesName}: ${Math.abs(p.value)}`).join('<br/>')
        },
        legend: { data: ['Мужчины', 'Женщины'], top: 35 },
        grid: { left: '4%', right: '4%', bottom: 30, top: 90, containLabel: true },
        xAxis: { type: 'value', axisLabel: { formatter: (v) => Math.abs(v) } },
        yAxis: { type: 'category', data: categories },
        series: [
          { name: 'Мужчины', type: 'bar', stack: 'total', data: male, itemStyle: { color: '#5B8DEF' } },
          { name: 'Женщины', type: 'bar', stack: 'total', data: female, itemStyle: { color: '#F472B6' } }
        ]
      };
    }

    function mountSeriesFilters(container, names, onChange) {
      const wrap = document.createElement('div');
      wrap.className = 'filters';
      names.forEach((name) => {
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        checkbox.value = name;
        checkbox.addEventListener('change', () => {
          const selected = [...wrap.querySelectorAll('input:checked')].map((item) => item.value);
          onChange(selected);
        });
        label.appendChild(checkbox);
        label.append(` ${name}`);
        wrap.appendChild(label);
      });
      container.appendChild(wrap);
    }

    function resolveIndicators(indicators, subtypeMap, specs) {
      const result = [];
      for (const spec of specs) {
        const matches = indicators.filter((indicator) => {
          if (indicator.name !== spec.indicator) return false;
          const subtypeName = indicator.subtype_id ? subtypeMap.get(indicator.subtype_id) : null;

          if (!spec.subtype) return subtypeName === null;
          if (spec.subtype === '*') return true;

          return (subtypeName || '').toLowerCase() === spec.subtype.toLowerCase();
        });

        for (const match of matches) {
          if (!result.some((item) => item.id === match.id)) result.push(match);
        }
      }
      return result;
    }

    function renderMenu() {
      menuEl.innerHTML = '';
      for (const page of DASHBOARD) {
        const btn = document.createElement('button');
        btn.textContent = page.title;
        btn.className = page.id === activePageId ? 'active' : '';
        btn.onclick = () => {
          activePageId = page.id;
          renderPage().catch((e) => alert(e.message));
        };
        menuEl.appendChild(btn);
      }
    }

    async function renderPage() {
      clearCharts();
      renderMenu();
      contentEl.innerHTML = '<div class="card">Загрузка...</div>';

      const regionId = Number(document.getElementById('regionId').value || '1');
      const rawPopulationYear = Number(document.getElementById('populationYear').value);
      const yearValue = Number.isFinite(rawPopulationYear)
        ? Math.min(Math.max(rawPopulationYear, MIN_YEAR), MAX_YEAR)
        : null;
      const yearRange = getYearRange();

      const [indicators, subtypes] = await Promise.all([
        fetchIndicators(),
        fetchSubtypes(),
      ]);
      const subtypeMap = new Map(subtypes.map((item) => [item.id, item.name]));

      const page = DASHBOARD.find((item) => item.id === activePageId) || DASHBOARD[0];
      contentEl.innerHTML = `<div class="card"><h2>${page.title}</h2><div class="small">Графики построены по той же парадигме, что и в основном фронтенде: несколько показателей на одном графике, с учетом подпоказателей.</div></div>`;

      if (page.id === 's1') {
        const population = await fetchPopulation(regionId, yearValue);
        const popCard = document.createElement('div');
        popCard.className = 'card';
        popCard.innerHTML = '<h3>Половозрастная структура</h3><div id="populationChart" class="chart"></div>';
        contentEl.appendChild(popCard);
        const popChart = echarts.init(document.getElementById('populationChart'));
        popChart.setOption(buildPopulationOption(population), true);
        charts.push(popChart);
      }

      for (let idx = 0; idx < page.charts.length; idx++) {
        const chartCfg = page.charts[idx];
        const selected = resolveIndicators(indicators, subtypeMap, chartCfg.seriesSpecs);
        if (!selected.length) {
          const missCard = document.createElement('div');
          missCard.className = 'card';
          missCard.innerHTML = `<h3>${chartCfg.title}</h3><div class="small">Нет подходящих индикаторов в БД.</div>`;
          contentEl.appendChild(missCard);
          continue;
        }

        const payload = await fetchChartData(regionId, selected.map((item) => item.id));
        if (!payload.series.length) continue;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${chartCfg.title}</h3><div id="chart-${idx}" class="chart"></div>`;
        contentEl.appendChild(card);

        const chart = echarts.init(document.getElementById(`chart-${idx}`));
        const allSeriesNames = payload.series.map((item) => item.indicator_name);

        const renderOption = (enabledSeries) => {
          if (chartCfg.chartType === 'pie') {
            chart.setOption(buildPieOption(payload, chartCfg.title, enabledSeries, yearRange), true);
            return;
          }
          chart.setOption(buildLineOption(payload, chartCfg.title, enabledSeries, yearRange), true);
        };

        renderOption(allSeriesNames);
        charts.push(chart);
        mountSeriesFilters(card, allSeriesNames, renderOption);
      }
    }

    document.getElementById('reloadBtn').addEventListener('click', () => renderPage().catch((e) => alert(e.message)));
    window.addEventListener('resize', () => charts.forEach(c => c.resize()));

    renderPage().catch((e) => {
      contentEl.innerHTML = `<div class='card'>Ошибка: ${e.message}</div>`;
    });
  </script>
</body>
</html>
