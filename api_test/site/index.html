<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Test Charts</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fb; color: #1f2937; }
    header { padding: 16px 20px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 2; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .top input, .top select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px; }
    nav { background: #fff; border-radius: 12px; padding: 12px; height: fit-content; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    nav button { display: block; width: 100%; margin-bottom: 8px; padding: 10px; border: none; border-radius: 8px; text-align: left; cursor: pointer; background: #e2e8f0; }
    nav button.active { background: #1d4ed8; color: #fff; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .chart { height: 520px; }
    .small { font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>Интерактивные графики (данные из БД через backend API)</h1>
    <div class="top">
      <label>API URL <input id="apiUrl" value="http://127.0.0.1:8080"/></label>
      <label>Region ID <input id="regionId" type="number" value="1"/></label>
      <label>Год для пирамиды <input id="populationYear" type="number" placeholder=""/></label>
      <button id="reloadBtn">Обновить страницу</button>
    </div>
    
  </header>

  <div class="layout">
    <nav id="menu"></nav>
    <main id="content"></main>
  </div>

  <script>
    const PAGES = [
      {
        id: 'demography',
        title: 'Демография',
        subtitle: 'Пирамида',
        groups: [
          { title: 'Рождаемость/смертность/миграция', match: ['рождаем', 'смерт', 'миграц'], max: 3 }
        ]
      }
    ];

    const menuEl = document.getElementById('menu');
    const contentEl = document.getElementById('content');
    let activePageId = PAGES[0].id;
    let charts = [];

    function apiBase() {
      return document.getElementById('apiUrl').value.replace(/\/$/, '');
    }

    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`Ошибка API: ${url}`);
      return r.json();
    }

    async function fetchIndicators() {
      return fetchJson(`${apiBase()}/indicators/get_chunk?limit=5000&offset=0`);
    }

    function pickIndicators(indicators, keywords, maxCount) {
      const lowerKeywords = keywords.map(k => k.toLowerCase());
      const matched = indicators.filter((i) => {
        const text = `${i.name} ${i.theme || ''} ${i.type || ''}`.toLowerCase();
        return lowerKeywords.some((k) => text.includes(k));
      });
      if (matched.length >= maxCount) return matched.slice(0, maxCount);

      const fallback = indicators.filter(i => !matched.some(m => m.id === i.id)).slice(0, maxCount - matched.length);
      return [...matched, ...fallback];
    }

    async function fetchChartData(regionId, indicatorIds) {
      const url = new URL(`${apiBase()}/analytics/chart_data`);
      url.searchParams.set('region_id', String(regionId));
      indicatorIds.forEach((id) => url.searchParams.append('indicator_ids', String(id)));
      return fetchJson(url.toString());
    }

    async function fetchPopulation(regionId, yearValue) {
      const url = new URL(`${apiBase()}/analytics/population_pyramid`);
      url.searchParams.set('region_id', String(regionId));
      if (yearValue) url.searchParams.set('year', String(yearValue));
      return fetchJson(url.toString());
    }

    function clearCharts() {
      charts.forEach(c => c.dispose());
      charts = [];
    }

    function buildLineOption(payload, title) {
      const years = [...new Set(payload.series.flatMap(s => s.points.map(p => Number(p.year))))].sort((a,b) => a-b);
      const series = payload.series.map((s) => {
        const map = new Map(s.points.map((p) => [Number(p.year), Number(p.value)]));
        return { name: s.indicator_name, type: 'line', smooth: true, data: years.map(y => map.get(y) ?? null) };
      });
      return {
        title: { text: `${title}: ${payload.region_name}`, left: 'center' },
        tooltip: { trigger: 'axis' },
        legend: { data: series.map(s => s.name), top: 35 },
        grid: { left: '4%', right: '4%', bottom: 30, top: 90, containLabel: true },
        xAxis: { type: 'category', data: years.map(String) },
        yAxis: { type: 'value' },
        series
      };
    }

    function buildPieOption(payload, title) {
      const points = payload.series.map((s) => {
        const last = [...s.points].sort((a,b) => Number(a.year)-Number(b.year)).at(-1);
        return { name: s.indicator_name, value: last ? Number(last.value) : 0 };
      }).filter(p => p.value !== null);

      return {
        title: { text: `${title} (последние значения): ${payload.region_name}`, left: 'center' },
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        legend: { orient: 'vertical', left: 10, top: 60 },
        series: [{ type: 'pie', radius: '55%', center: ['58%', '58%'], data: points }]
      };
    }

    function buildPopulationOption(payload) {
      const categories = payload.points.map(p => p.age_code);
      const male = payload.points.map(p => -Number(p.male));
      const female = payload.points.map(p => Number(p.female));
      return {
        title: { text: `Половозрастная пирамида: ${payload.region_name} (${payload.year})`, left: 'center' },
        tooltip: {
          trigger: 'axis', axisPointer: { type: 'shadow' },
          formatter: (params) => params.map((p) => `${p.seriesName}: ${Math.abs(p.value)}`).join('<br/>')
        },
        legend: { data: ['Мужчины', 'Женщины'], top: 35 },
        grid: { left: '4%', right: '4%', bottom: 30, top: 90, containLabel: true },
        xAxis: { type: 'value', axisLabel: { formatter: (v) => Math.abs(v) } },
        yAxis: { type: 'category', data: categories },
        series: [
          { name: 'Мужчины', type: 'bar', stack: 'total', data: male, itemStyle: { color: '#5B8DEF' } },
          { name: 'Женщины', type: 'bar', stack: 'total', data: female, itemStyle: { color: '#F472B6' } }
        ]
      };
    }

    function renderMenu() {
      menuEl.innerHTML = '';
      for (const page of PAGES) {
        const btn = document.createElement('button');
        btn.textContent = page.title;
        btn.className = page.id === activePageId ? 'active' : '';
        btn.onclick = () => { activePageId = page.id; renderPage().catch((e) => alert(e.message)); };
        menuEl.appendChild(btn);
      }
    }

    async function renderPage() {
      clearCharts();
      renderMenu();
      contentEl.innerHTML = '<div class="card">Загрузка...</div>';

      const page = PAGES.find(p => p.id === activePageId);
      const regionId = Number(document.getElementById('regionId').value || '1');
      const yearValue = document.getElementById('populationYear').value;

      const indicators = await fetchIndicators();

      contentEl.innerHTML = `<div class="card"><h2>${page.title}</h2><div class="small">${page.subtitle}</div></div>`;

      if (page.id === 'demography') {
        const population = await fetchPopulation(regionId, yearValue);
        const popCard = document.createElement('div');
        popCard.className = 'card';
        popCard.innerHTML = '<div id="populationChart" class="chart"></div>';
        contentEl.appendChild(popCard);
        const chart = echarts.init(document.getElementById('populationChart'));
        chart.setOption(buildPopulationOption(population), true);
        charts.push(chart);
      }

      for (let idx = 0; idx < page.groups.length; idx++) {
        const group = page.groups[idx];
        const chosen = pickIndicators(indicators, group.match, group.max);
        if (!chosen.length) continue;

        const payload = await fetchChartData(regionId, chosen.map(c => c.id));

        const lineCard = document.createElement('div');
        lineCard.className = 'card';
        lineCard.innerHTML = `<h3>${group.title} — линейный график</h3><div id="line-${idx}" class="chart"></div>`;
        contentEl.appendChild(lineCard);
        const line = echarts.init(document.getElementById(`line-${idx}`));
        line.setOption(buildLineOption(payload, group.title), true);
        charts.push(line);

        const pieCard = document.createElement('div');
        pieCard.className = 'card';
        pieCard.innerHTML = `<h3>${group.title} — круговая диаграмма</h3><div id="pie-${idx}" class="chart"></div>`;
        contentEl.appendChild(pieCard);
        const pie = echarts.init(document.getElementById(`pie-${idx}`));
        pie.setOption(buildPieOption(payload, group.title), true);
        charts.push(pie);
      }
    }

    document.getElementById('reloadBtn').addEventListener('click', () => renderPage().catch((e) => alert(e.message)));
    window.addEventListener('resize', () => charts.forEach(c => c.resize()));

    renderPage().catch((e) => {
      contentEl.innerHTML = `<div class='card'>Ошибка: ${e.message}</div>`;
    });
  </script>
</body>
</html>
