services:
  db:
    image: postgres:15
    container_name: climate-db
    environment:
      POSTGRES_DB: ${DB_NAME:-climate_db}
      POSTGRES_USER: ${DB_USER:-climate_user}
      POSTGRES_PASSWORD: ${DB_PASS:-climate_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-climate_user} -d ${DB_NAME:-climate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: climate-backend
    command: uvicorn app:app --host 0.0.0.0 --port 8081 --reload
    volumes:
      - .:/app
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-climate_user}
      DB_PASS: ${DB_PASS:-climate_pass}
      DB_NAME: ${DB_NAME:-climate_db}
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
